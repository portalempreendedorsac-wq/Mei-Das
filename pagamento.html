<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Pagamento via PIX</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f0f0; margin: 0; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
    .pix-title { color: #0d47a1; font-size: 22px; margin-bottom: 20px; font-weight: bold;}
    .qr-box { background: #f9f9f9; border: 2px dashed #ccc; padding: 20px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; color: #555; }
    .pix-code { background: #f1f3f4; border: 1px solid #ccc; border-radius: 4px; padding: 12px; font-size: 11px; word-break: break-all; text-align: left; margin-bottom: 15px; color: #333;}
    .btn { padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; font-size: 15px; margin-top: 10px; }
    .btn-blue { background: #0d47a1; color: #fff; }
    .btn-green { background: #2e7d32; color: #fff; }
  </style>
</head>
<body>
  <div class="container">
    <div class="pix-title">Pague com o PIX para Regularizar</div>
    
    <div class="qr-box">
      [ QR CODE PIX DE COBRANÇA ]<br>
      <span style="font-size: 13px; color: #2e7d32;">Valor Total: R$ 91,55</span>
    </div>

    <div class="pix-code" id="pix-string">00020126580014br.gov.bcb.pix0136-chave-pix-exemplo-regularizacao-mei-9155</div>
    <button class="btn btn-blue" onclick="copiarPix()">Copiar código PIX</button>

    <button class="btn btn-green" onclick="window.location.href='obrigado.html'">Já fiz o pagamento</button>
  </div>

  <script>
    function copiarPix() {
      navigator.clipboard.writeText(document.getElementById('pix-string').innerText);
      alert('Código PIX copiado com sucesso!');
    }
  </script>
</body>
</html>
