<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>PGMEI - Programa Gerador de DAS</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; }
    .header { background: #dcedc8; padding: 15px 30px; border-bottom: 3px solid #8bc34a; }
    .logo { color: #2e7d32; font-weight: 900; font-size: 22px; display: flex; align-items: center; gap: 10px; }
    .logo-box { background: #4caf50; color: white; padding: 2px 8px; border-radius: 4px; font-size: 16px; }
    .sub { color: #555; font-size: 14px; margin-top: 5px; }
    .container { max-width: 950px; margin: 20px auto; background: #fff; padding: 20px; border: 1px solid #ccc; box-shadow: 0 0 10px rgba(0,0,0,0.05); }
    .info-bar { border: 1px solid #ddd; padding: 12px; margin-bottom: 20px; font-size: 12px; color: #333; }
    .table-container { background: #f9f9f9; padding: 15px; border: 1px solid #ddd; }
    table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 15px; }
    th, td { border-bottom: 1px solid #ddd; padding: 8px; text-align: left; }
    th { color: #0d47a1; }
    .devedor { color: #d32f2f; font-weight: bold; background: #fff9c4; }
    .buttons { text-align: center; margin-top: 30px; }
    .btn { padding: 10px 20px; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 13px; margin: 0 5px; }
    .btn-green { background: #4caf50; color: #fff; }
    .btn-gray { background: #e0e0e0; color: #333; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo"><span class="logo-box">S</span> PGMEI</div>
    <div class="sub">Programa Gerador de DAS do Microempreendedor Individual</div>
  </div>
  <div class="container">
    <div class="info-bar">CNPJ: <strong id="cnpj-display"></strong> Nome: <strong id="nome-display"></strong></div>
    
    <div class="table-container">
      <div style="font-size: 13px; text-align: center; margin-bottom: 15px;">Informe o Ano-Calendário: <select><option>2026</option></select></div>
      <p style="font-size: 13px;">Selecione o(s) período(s) de apuração:</p>
      <table>
        <thead>
          <tr>
            <th>Período de Apuração</th><th>Situação</th><th>Principal</th><th>Multa</th><th>Juros</th><th>Total</th><th>Data de Vencimento</th>
          </tr>
        </thead>
        <tbody id="tabela-pendencias">
          <!-- Os dados virão da sua planilha via JS -->
        </tbody>
      </table>
      <div class="buttons">
        <button class="btn btn-gray">Atualizar Valores</button>
        <button class="btn btn-gray">Apurar/Gerar DAS</button>
        <button class="btn btn-green" onclick="irParaPagamento()">Pagar Online (PIX)</button>
      </div>
    </div>
  </div>

  <script>
    // Recupera os dados da consulta feita na página inicial
    const dados = JSON.parse(localStorage.getItem('dadosEmpresaCNPJ360'));
    if(dados) {
      document.getElementById('cnpj-display').innerText = dados.empresa.cnpj;
      document.getElementById('nome-display').innerText = dados.empresa.nome;
      
      const tb = document.getElementById('tabela-pendencias');
      dados.pendencias.forEach(p => {
         const row = document.createElement('tr');
         if(p.situacao !== 'Pago') row.className = 'devedor';
         row.innerHTML = `
           <td><input type="checkbox" ${p.situacao !== 'Pago' ? 'checked' : ''}> ${p.competencia}</td>
           <td>${p.situacao}</td>
           <td>R$ ${p.valor.toFixed(2).replace('.', ',')}</td>
           <td>R$ 0,00</td>
           <td>R$ 0,00</td>
           <td>R$ ${p.valor.toFixed(2).replace('.', ',')}</td>
           <td>${p.vencimento}</td>
         `;
         tb.appendChild(row);
      });
    }

    function irParaPagamento() {
      // Salva o ID da primeira pendência encontrada para gerar o PIX
      if(dados && dados.pendencias.length > 0) {
        localStorage.setItem('pendenciaPagamento', dados.pendencias[0].id);
        window.location.href = 'pagamento.html';
      }
    }
  </script>
</body>
</html>
