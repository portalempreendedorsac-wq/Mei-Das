<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>PGMEI - Programa Gerador de DAS</title>
  <style>
    body { font-family: Arial, sans-serif; background: #ffffff; margin: 0; color: #111; }
    .header { background: #dcedc8; padding: 12px 25px; border-bottom: 3px solid #8bc34a; }
    .logo { color: #2e7d32; font-weight: 900; font-size: 20px; display: flex; align-items: center; gap: 8px; }
    .logo-box { background: #4caf50; color: white; padding: 2px 8px; border-radius: 4px; font-size: 14px; }
    .sub { color: #555; font-size: 13px; margin-top: 3px; }
    .container { max-width: 1000px; margin: 15px auto; background: #fff; padding: 15px; border: 1px solid #ccc; }
    .info-bar { background: #e3f2fd; border: 1px solid #90caf9; padding: 10px 15px; margin-bottom: 15px; font-size: 12px; color: #0d47a1; }
    .info-bar strong { background: #fff; padding: 2px 6px; border: 1px solid #90caf9; border-radius: 3px; color: #000; }
    .table-container { background: #f9f9f9; padding: 12px; border: 1px solid #ddd; }
    table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 10px; background: #fff; }
    th, td { border: 1px solid #e0e0e0; padding: 7px 10px; text-align: left; }
    th { background: #f1f3f4; color: #333; font-weight: bold; }
    .devedor { color: #d32f2f; font-weight: bold; background: #fffde7; }
    .botoes-acao { margin-top: 20px; text-align: center; display: flex; justify-content: center; gap: 10px; }
    .btn-pg { background: #2e7d32; color: white; border: none; padding: 10px 25px; font-weight: bold; cursor: pointer; border-radius: 4px; font-size: 13px;}
    .btn-pg:hover { background: #1b5e20; }
    .btn-voltar { background: #757575; color: white; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; border-radius: 4px; font-size: 13px;}
  </style>
</head>
<body>
  <div class="header">
    <div class="logo"><span class="logo-box">S</span> PGMEI</div>
    <div class="sub">Programa Gerador de DAS do Microempreendedor Individual</div>
  </div>
  
  <div class="container">
    <div class="info-bar">
      CNPJ: <strong id="cnpj-display">Carregando...</strong> &nbsp;&nbsp;|&nbsp;&nbsp; Nome: <strong id="nome-display">Carregando...</strong>
    </div>
    
    <div class="table-container">
      <div style="font-size: 12px; margin-bottom: 10px;">Informe o Ano-Calendário: <select style="padding: 2px 5px;"><option>2026</option></select></div>
      <p style="font-size: 12px; font-weight: bold; color: #444;">Selecione o(s) período(s) de apuração:</p>
      
      <table>
        <thead>
          <tr>
            <th style="width: 30px;"></th>
            <th>Período de Apuração</th>
            <th>Situação</th>
            <th>Principal</th>
            <th>Multa</th>
            <th>Juros</th>
            <th>Total</th>
            <th>Data de Vencimento</th>
            <th>Data de Acolhimento</th>
          </tr>
        </thead>
        <tbody id="tabela-corpo">
          <!-- Conteúdo gerado automaticamente -->
        </tbody>
      </table>

      <div class="botoes-acao">
        <button class="btn-voltar" onclick="window.location.href='admin.html'">Painel Admin</button>
        <button class="btn-pg" onclick="window.location.href='pagamento.html'">Pagar Online (PIX)</button>
      </div>
    </div>
  </div>

  <script>
    // Pega o CNPJ enviado na URL (ex: pgmei.html?cnpj=68.362.936/0001-04)
    const urlParams = new URLSearchParams(window.location.search);
    const cnpjUrl = urlParams.get('cnpj');

    const baseDemonstracao = JSON.parse(localStorage.getItem("baseDemonstracao") || "[]");
    let dadosCliente = null;

    if (cnpjUrl) {
      // Limpa pontuações para comparar com segurança
      const cnpjLimpo = cnpjUrl.replace(/\D/g, "");
      const encontrados = baseDemonstracao.filter(item => String(item.cnpj).replace(/\D/g, "") === cnpjLimpo);
      
      if (encontrados.length > 0) {
        dadosCliente = {
          cnpj: encontrados[0].cnpj,
          nome: encontrados[0].nome || "CLIENTE CADASTRADO",
          pendencias: encontrados
        };
      }
    }

    // Se não encontrou pela URL mas tem algo salvo na memória
    if (!dadosCliente && baseDemonstracao.length > 0) {
      dadosCliente = {
        cnpj: baseDemonstracao[0].cnpj,
        nome: baseDemonstracao[0].nome || "CLIENTE CADASTRADO",
        pendencias: baseDemonstracao
      };
    }

    if (dadosCliente) {
      document.getElementById('cnpj-display').innerText = dadosCliente.cnpj;
      document.getElementById('nome-display').innerText = dadosCliente.nome;

      const mesesFixos = [
        "Janeiro/2026", "Fevereiro/2026", "Março/2026", "Abril/2026", 
        "Maio/2026", "Junho/2026", "Julho/2026", "Agosto/2026", 
        "Setembro/2026", "Outubro/2026", "Novembro/2026", "Dezembro/2026"
      ];

      const tbody = document.getElementById('tabela-corpo');
      tbody.innerHTML = "";

      mesesFixos.forEach(mes => {
        const nomeMesAbrev = mes.split('/')[0].toLowerCase();
        // Procura na planilha o mês correspondente
        const pendenciaMes = dadosCliente.pendencias.find(p => String(p.competencia).toLowerCase().includes(nomeMesAbrev));
        
        const tr = document.createElement('tr');
        
        if (pendenciaMes && Number(pendenciaMes.valor) > 0) {
          const val = Number(pendenciaMes.valor).toFixed(2).replace('.', ',');
          tr.className = 'devedor';
          tr.innerHTML = `
            <td><input type="checkbox" checked></td>
            <td>${mes}</td>
            <td>Devedor</td>
            <td>R$ ${val}</td>
            <td>R$ 0,00</td>
            <td>R$ 0,00</td>
            <td>R$ ${val}</td>
            <td>${pendenciaMes.vencimento || '20/08/2026'}</td>
            <td>${pendenciaMes.vencimento || '20/08/2026'}</td>
          `;
        } else {
          tr.innerHTML = `
            <td><input type="checkbox" disabled></td>
            <td>${mes}</td>
            <td style="color: #666;">Não Optante</td>
            <td>R$ 0,00</td>
            <td>R$ 0,00</td>
            <td>R$ 0,00</td>
            <td>-</td>
            <td>-</td>
            <td>-</td>
          `;
        }
        tbody.appendChild(tr);
      });
    } else {
      document.querySelector('.container').innerHTML = `
        <div style="text-align:center; padding: 40px;">
          <h3 style="color: #d32f2f;">Nenhum cliente carregado!</h3>
          <p>Você precisa importar a sua planilha Excel no Painel Administrativo primeiro.</p>
          <button class="btn-pg" onclick="window.location.href='admin.html'">Ir para o Painel Admin</button>
        </div>`;
    }
  </script>
</body>
</html>
